<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of The Daily Grind storefront with a striped awning">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EDE0"/>
      <stop offset="100%" stop-color="#EFE2CF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E4C46"/>
      <stop offset="48%" stop-color="#55665D"/>
      <stop offset="100%" stop-color="#3A473F"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E7D6"/>
      <stop offset="100%" stop-color="#E7D8C2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Facade -->
  <rect x="60" y="70" width="680" height="450" fill="url(#brick)"/>
  <rect x="60" y="70" width="680" height="450" fill="none" stroke="#DCC9AE" stroke-width="2"/>
  <g stroke="#E0CDB2" stroke-width="1.5" opacity="0.8">
    <path d="M60 140 H740 M60 210 H740 M60 280 H740"/>
  </g>

  <!-- Cornice -->
  <rect x="44" y="52" width="712" height="26" rx="6" fill="#2B1C13"/>
  <rect x="52" y="78" width="696" height="10" fill="#3A281C"/>

  <!-- Sign board -->
  <rect x="176" y="100" width="448" height="86" rx="10" fill="#2B1C13"/>
  <rect x="188" y="112" width="424" height="62" rx="6" fill="none" stroke="#C89A4A" stroke-width="2"/>
  <text x="400" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-style="italic" fill="#FFF8EF" letter-spacing="1">The Daily Grind</text>
  <text x="400" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="11" fill="#C89A4A" letter-spacing="5">SAN FRANCISCO</text>

  <!-- Awning -->
  <g>
    <path d="M92 210 H708 L740 300 H60 Z" fill="#B4592A"/>
    <g fill="#FBF3E7">
      <path d="M158 210 H224 L242 300 H176 Z"/>
      <path d="M290 210 H356 L368 300 H302 Z"/>
      <path d="M422 210 H488 L494 300 H428 Z"/>
      <path d="M554 210 H620 L626 300 H560 Z"/>
    </g>
    <path d="M60 300 H740 v14 a 8 8 0 0 1 -8 8 H68 a 8 8 0 0 1 -8 -8 Z" fill="#8F4420"/>
    <path d="M92 210 H708 L740 300 H60 Z" fill="none" stroke="#8F4420" stroke-width="2"/>
  </g>

  <!-- Windows -->
  <g>
    <rect x="96" y="336" width="238" height="184" rx="8" fill="url(#glass)"/>
    <rect x="96" y="336" width="238" height="184" rx="8" fill="none" stroke="#2B1C13" stroke-width="8"/>
    <path d="M120 500 L236 344 M188 500 L304 344" stroke="#FFF8EF" stroke-width="10" opacity="0.10"/>
    <!-- Table and cups in the window -->
    <rect x="140" y="446" width="128" height="8" rx="4" fill="#8A6C46" opacity="0.85"/>
    <rect x="168" y="454" width="8" height="46" fill="#8A6C46" opacity="0.85"/>
    <circle cx="168" cy="432" r="12" fill="#FFF8EF" opacity="0.9"/>
    <circle cx="230" cy="434" r="10" fill="#C89A4A" opacity="0.9"/>

    <rect x="466" y="336" width="238" height="184" rx="8" fill="url(#glass)"/>
    <rect x="466" y="336" width="238" height="184" rx="8" fill="none" stroke="#2B1C13" stroke-width="8"/>
    <path d="M490 500 L606 344 M558 500 L674 344" stroke="#FFF8EF" stroke-width="10" opacity="0.10"/>
    <rect x="516" y="452" width="136" height="8" rx="4" fill="#8A6C46" opacity="0.85"/>
    <circle cx="556" cy="438" r="11" fill="#FFF8EF" opacity="0.9"/>
    <circle cx="612" cy="440" r="9" fill="#C89A4A" opacity="0.9"/>
  </g>

  <!-- Door -->
  <rect x="352" y="322" width="96" height="198" rx="6" fill="#6E4324"/>
  <rect x="352" y="322" width="96" height="198" rx="6" fill="none" stroke="#2B1C13" stroke-width="7"/>
  <rect x="368" y="340" width="64" height="80" rx="4" fill="url(#glass)"/>
  <rect x="368" y="340" width="64" height="80" rx="4" fill="none" stroke="#2B1C13" stroke-width="4"/>
  <circle cx="434" cy="432" r="5" fill="#C89A4A"/>
  <rect x="374" y="440" width="52" height="18" rx="4" fill="#FBF3E7" opacity="0.92"/>
  <text x="400" y="453" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="10" font-weight="bold" fill="#6F7F63" letter-spacing="1">OPEN</text>

  <!-- Sidewalk -->
  <rect x="0" y="520" width="800" height="80" fill="#E2D5C0"/>
  <rect x="0" y="520" width="800" height="6" fill="#D3C2A8"/>
  <g stroke="#D3C2A8" stroke-width="2">
    <path d="M120 526 V600 M300 526 V600 M500 526 V600 M680 526 V600"/>
  </g>

  <!-- Planters -->
  <g>
    <rect x="72" y="470" width="56" height="52" rx="6" fill="#B4592A"/>
    <rect x="66" y="462" width="68" height="14" rx="5" fill="#8F4420"/>
    <path d="M100 462 C 80 430, 78 408, 92 394 C 100 414, 104 430, 100 462 Z" fill="#6F7F63"/>
    <path d="M100 462 C 122 434, 128 412, 116 398 C 106 418, 100 434, 100 462 Z" fill="#7F8F72"/>
  </g>
  <g>
    <rect x="672" y="470" width="56" height="52" rx="6" fill="#B4592A"/>
    <rect x="666" y="462" width="68" height="14" rx="5" fill="#8F4420"/>
    <path d="M700 462 C 680 430, 678 408, 692 394 C 700 414, 704 430, 700 462 Z" fill="#6F7F63"/>
    <path d="M700 462 C 722 434, 728 412, 716 398 C 706 418, 700 434, 700 462 Z" fill="#7F8F72"/>
  </g>

  <!-- A-frame chalkboard -->
  <g transform="translate(214 452)">
    <path d="M0 68 L14 0 H58 L72 68 Z" fill="#3A281C"/>
    <path d="M8 60 L18 8 H54 L64 60 Z" fill="#2B1C13"/>
    <g stroke="#FBF3E7" stroke-width="2.5" opacity="0.75" stroke-linecap="round">
      <path d="M20 22 H52 M18 34 H46 M22 46 H50"/>
    </g>
  </g>
</svg>
